name: demo

# Builds the generalized-maxflow WebAssembly solver from the submodule and the
# browser demo on every push; publishes it to GitHub Pages when run manually.
# Enable Pages once under Settings -> Pages with the source "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
      - name: Build the WebAssembly solver
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash third_party/generalized-maxflow/bindings/wasm/build.sh --test
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r docs/* site/
          cp third_party/generalized-maxflow/bindings/wasm/pkg/index.mjs \
             third_party/generalized-maxflow/bindings/wasm/pkg/gmaxflow.js \
             third_party/generalized-maxflow/bindings/wasm/pkg/gmaxflow.wasm site/
          ls -l site site/data
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: site
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
